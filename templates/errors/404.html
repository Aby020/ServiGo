{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found - ServiGo{% endblock %}

{% block content %}
<section class="section-pad">
    <div class="container text-center" style="max-width:36rem;">
        <div class="display-1 fw-bold text-primary mb-3">404</div>
        <h1 class="h3 mb-3">Oops! Page not found</h1>
        <p class="text-muted mb-5">
            The page you're looking for doesn't exist or has been moved.
            Let's get you back on track.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'core:home' %}" class="btn btn-primary btn-lg">
                <i class="bi bi-house me-2"></i> Back to home
            </a>
            <a href="{% url 'services:list' %}" class="btn btn-light btn-lg">Browse services</a>
        </div>
    </div>
</section>
{% endblock content %}
