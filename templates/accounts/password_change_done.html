{% extends 'base.html' %}
{% load static %}

{% block title %}Password Changed - ServiGo{% endblock %}

{% block content %}
<section class="section-pad" style="min-height:60vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 text-center">
                <div class="content-card py-5">
                    <div class="display-4 text-success mb-3">
                        <i class="bi bi-patch-check-fill"></i>
                    </div>
                    <h1 class="h3 mb-3">Password updated successfully</h1>
                    <p class="text-muted mb-4">
                        Your password has been changed. Use your new password the next time you sign in.
                    </p>
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'accounts:profile' %}" class="btn btn-primary">
                            <i class="bi bi-person me-1"></i> Back to profile
                        </a>
                        <a href="{% url 'core:home' %}" class="btn btn-light">Go home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
